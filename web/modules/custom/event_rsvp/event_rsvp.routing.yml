event_rsvp.set_status:
  path: '/event/{node}/rsvp/{status}'
  defaults:
    _controller: '\Drupal\event_rsvp\Controller\EventRsvpController::setStatus'
    _title: 'Set RSVP Status'
  requirements:
    _user_is_logged_in: 'TRUE'
    status: 'going|maybe|not_going'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node

event_rsvp.anonymous_form:
  path: '/event/{node}/rsvp-form/{status}'
  defaults:
    _form: '\Drupal\event_rsvp\Form\AnonymousRsvpForm'
    _title: 'RSVP to Event'
  requirements:
    _access: 'TRUE'
    status: 'going|maybe|not_going'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node