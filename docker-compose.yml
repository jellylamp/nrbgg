version: "3.8"

services:
  mysql:
    image: "mysql:${MYSQL_TAG}"
    container_name: "${PROJECT_NAME}_mysql"
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: $DB_ROOT_PASSWORD
      MYSQL_DATABASE: $DB_NAME
      MYSQL_USER: $DB_USER
      MYSQL_PASSWORD: $DB_PASSWORD
    volumes:
      - database:/var/lib/mysql
    labels:
      - "traefik.enable=false"


  php:
    image: wodby/drupal-php:$PHP_TAG
    container_name: "${PROJECT_NAME}_php"
    environment:
      PHP_SENDMAIL_PATH: /usr/sbin/sendmail -t -i -S mailhog:1025
      DB_HOST: $DB_HOST
      DB_PORT: $DB_PORT
      DB_USER: $DB_USER
      DB_PASSWORD: $DB_PASSWORD
      DB_NAME: $DB_NAME
      DB_DRIVER: $DB_DRIVER
      PHP_FPM_USER: wodby
      PHP_FPM_GROUP: wodby
      COLUMNS: 80 # Set 80 columns for docker exec -it.
      ## Read instructions at https://wodby.com/docs/stacks/php/local/#xdebug
      ## Uncomment the following and PHP_XDEBUG_CLIENT_HOST to enable xdebug.
#      PHP_XDEBUG: 1
#      PHP_XDEBUG_MODE: debug
#      PHP_XDEBUG_START_WITH_REQUEST: "yes"
#      PHP_IDE_CONFIG: "serverName=default" # required for debugging of CLI requests
#      # Uncomment PHP_XDEBUG_CLIENT_HOST based on system.system
#      PHP_XDEBUG_CLIENT_HOST: host.docker.internal # Docker 18.03+ Mac/Win
 
    volumes:
      ## For macOS users (https://wodby.com/docs/stacks/drupal/local#docker-for-mac)
      - ./:/var/www/html:cached
    labels:
      - "traefik.enable=false"

  apache:
    image: wodby/apache:$APACHE_TAG
    container_name: "${PROJECT_NAME}_apache"
    depends_on:
      - php
    environment:
      APACHE_LOG_LEVEL: debug
      APACHE_BACKEND_HOST: php
      APACHE_VHOST_PRESET: php
      APACHE_DOCUMENT_ROOT: /var/www/html/web
    ports:
      - "${APACHE_PORT}:80"
    volumes:
      # For macOS users (https://wodby.com/docs/stacks/drupal/local#docker-for-mac)
      - ./:/var/www/html:cached
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}_apache.rule=Host(`${PROJECT_BASE_URL}`)"
      - "traefik.http.services.${PROJECT_NAME}_apache.loadbalancer.server.port=${APACHE_PORT}"

  portainer:
    image: portainer/portainer:1.24.2
    container_name: "${PROJECT_NAME}_portainer"
    command: --no-auth -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}_portainer.rule=Host(`portainer.${PROJECT_BASE_URL}`)"
      - "traefik.http.services.${PROJECT_NAME}_portainer.loadbalancer.server.port=9000"

  traefik:
    image: traefik:v2.10
    container_name: "${PROJECT_NAME}_traefik"
    command:
      - --api.insecure=true
      - --providers.docker
      - --log.level=INFO
    ports:
      - "8000:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  database:
